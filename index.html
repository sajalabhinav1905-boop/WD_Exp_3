<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiment 3 - Task Master</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="py-5">
  <div class="container" style="max-width: 520px;">
    <div class="todo-card">
      <div class="todo-header text-center">
        <h2 class="h4 mb-1">Task Tracker</h2>
        <p class="small mb-0 opacity-75">DOM Manipulation & LocalStorage Persistence</p>
      </div>

      <div class="p-4">
        <!-- Input Form -->
        <div class="input-group mb-3">
          <input type="text" id="taskInput" class="form-control" placeholder="What needs to be done?">
          <button class="btn btn-primary" onclick="addTask()">Add Task</button>
        </div>

        <!-- Filter Buttons -->
        <div class="d-flex justify-content-between align-items-center mb-3">
          <span class="small text-muted" id="taskCount">0 tasks left</span>
          <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-secondary filter-btn active" onclick="setFilter('all')">All</button>
            <button class="btn btn-outline-secondary filter-btn" onclick="setFilter('active')">Active</button>
            <button class="btn btn-outline-secondary filter-btn" onclick="setFilter('completed')">Done</button>
          </div>
        </div>

        <!-- Task List Container -->
        <ul id="taskList" class="list-group mb-3"></ul>

        <div class="text-end">
          <button class="btn btn-link btn-sm text-danger text-decoration-none p-0" onclick="clearCompleted()">Clear completed</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
